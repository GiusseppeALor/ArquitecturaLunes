<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil de Usuario | EcoHospedajes Rurales</title>
    <link rel="stylesheet" href="/Css/perfil.css">
</head>
<body>
    <div class="profile-container">
        <div class="profile-card">
            <h2 class="title">Perfil de Usuario</h2>

            <div class="section-header">
                <h3>Datos personales</h3><br><br><br>
                <button class="edit-btn">Editar</button>
            </div>

            <div class="user-info">
                <div class="info-text">
                    <div class="info-item">
                        <p class="label">Nombre</p><br><br>
                        
                    </div>
                    <div class="info-item">
                        <p class="label">Correo electrónico</p> <br><br>
                        
                    </div>
                    <div class="info-item">
                        <p class="label">Teléfono</p><br><br>
                       
                    </div>
                </div>
                <img src="/img/logo.jpg" alt="Foto de perfil" class="profile-pic">
            </div>

            <div class="divider"></div>

            <div class="option">
                <span>Cambio de contraseña</span>
                <span class="arrow">›</span>
            </div>

            <div class="option">
                <span>Historial de actividad</span>
                <span class="arrow">›</span>
            </div>
        </div>
    </div>
</body>
</html>
