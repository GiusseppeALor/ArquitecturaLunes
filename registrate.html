<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro | EcoHospedajes Rurales</title>
    <link rel="stylesheet" href="/Css/Registrate.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="logo">
                <img src="/img/logo.jpg" alt="Logo ">
                <h2>EcoHospedajes Rurales</h2>
            </div>

            <h1>Regístrate en nuestra plataforma</h1>

            <form>
                <input type="text" placeholder="Nombre" required>
                <input type="text" placeholder="Apellidos" required>
                <input type="email" placeholder="Correo electrónico" required>
                <input type="password" placeholder="Contraseña" required>

                <a href="/login.html"><button type="submit">Registrarse</button></a>
            </form>

            <p class="switch-text">¿Ya tienes una cuenta? 
                <a href="/login.html">Inicia sesión</a>
            </p>
        </div>
    </div>
</body>
</html>
