<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | EcoHospedajes Rurales</title>
    <link rel="stylesheet" href="/Css/login.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="logo">
                <img src="/img/logo.jpg" alt="Logo" class="icono">
                <h2>EcoHospedajes Rurales</h2>
                <p>Reservas en hospedajes rurales de Perú</p>
            </div>

            <h1>Login</h1>
            
    <form id="loginForm">
    <label for="usuario">Usuario</label>
    <input type="text" id="usuario" placeholder="Ingresa tu usuario">

    <label for="contrasena">Contraseña</label>
    <input type="password" id="contrasena" placeholder="Ingresa tu contraseña">

    <button type="submit">Ingresar</button>
</form>

<script>
document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    const usuario = document.getElementById("usuario").value;
    const contrasena = document.getElementById("contrasena").value;

    const response = await fetch("http://localhost:8080/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: `usuario=${usuario}&contrasena=${contrasena}`
    });

    const result = await response.text();

    if (result === "OK") {
        alert("Login exitoso");
        window.location.href = "/logeado/index.html";
    } else {
        alert("Usuario o contraseña incorrectos");
    }
});
</script>


            <a href="/logindueño.html" class="forgot">Iniciar como dueño</a>
            <a href="/registrate.html" class="forgot">¿Aún no te has registrado?</a>
        </div>
    </div> 
</body>
</html>
