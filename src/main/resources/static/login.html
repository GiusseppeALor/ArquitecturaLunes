<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | EcoHospedajes Rurales</title>
    <link rel="stylesheet" href="/Css/login.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="logo">
                <img src="/img/logo.jpg" alt="Logo" class="icono">
                <h2>EcoHospedajes Rurales</h2>
                <p>Reservas en hospedajes rurales de Perú</p>
            </div>

            <h1>Login</h1>
            
            <form th:action="@{/verificarLogin}" method="post">
                <label for="usuario">Usuario</label>
                <input type="text" id="usuario" name="usuario" placeholder="Ingresa tu usuario" required>

                <label for="contrasena">Contraseña</label>
                <input type="password" id="contrasena" name="contrasena" placeholder="Ingresa tu contraseña" required>

                <button type="submit">Ingresar</button>
            </form>

            <a href="/logindueño.html" class="forgot">Iniciar como dueño</a>
            <a href="/registrate.html" class="forgot">¿Aún no te has registrado?</a>
        </div>
    </div> 
</body>
</html>
